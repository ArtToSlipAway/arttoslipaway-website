server {
    listen 80;
    listen [::]:80;

    server_name arttoslipaway.art www.arttoslipaway.art;

    return 301 https://arttoslipaway.art$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.arttoslipaway.art;

    ssl_certificate /etc/letsencrypt/live/arttoslipaway.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arttoslipaway.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://arttoslipaway.art$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name arttoslipaway.art;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/arttoslipaway.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arttoslipaway.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;


    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

location /static/ {
        alias /srv/arttoslipaway/app/static/;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location ~* ^/uploads/.*\.(php|phtml|php5|sh|bash|py|pl|cgi|asp|aspx|jsp|html|htm|js|svg|exe|bat|cmd)$ {

        deny all;

        return 403;

    }


    location /uploads/ {
        alias /srv/arttoslipaway/app/uploads/;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # No private attachments are exposed by an alias or static mount.
    location ^~ /private_files/ { return 404; }
    location ^~ /client/ {
        # A client URL is a bearer credential: do not record it in access logs.
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Aggressive scanners looking for WordPress or PHP entry points.
    location ~* ^/(wp-admin|wp-content|wp-includes|wordpress|blog/wp-|web/wp-|website/wp-|wp/|news/wp-|2018/wp-|2019/wp-|shop/wp-|wp1/wp-|test/wp-|wp2/wp-|site/wp-|cms/wp-|sito/wp-|xmlrpc\.php|.*wlwmanifest\.xml) {
        limit_req zone=ats_wp_noise burst=2 nodelay;
        access_log /var/log/nginx/arttoslipaway_security.log combined;
        return 444;
    }


    # Block common sensitive-file scanner probes before they hit FastAPI.
    location ~* ^/(?:\.git|\.svn|\.hg|\.bzr|\.env|\.env\..*|config\.json|credentials\.json|secrets\.json|service-account\.json|gcp-credentials\.json|google-credentials\.json|firebase-adminsdk\.json|key\.json|keyfile\.json|appsettings\.json|account\.json|api/config|api/env|actuator/env|server-status|phpinfo\.php)(?:/.*)?$ {
        access_log /var/log/nginx/arttoslipaway_security.log;
        limit_req zone=ats_wp_noise burst=2 nodelay;
        return 444;
    }

    # Common non-existing login probe. Real admin login is /admin/login.
    location = /login {
        access_log off;
        return 404;
    }

    # Brute-force protection for admin login.
    location = /admin/login {
        limit_req zone=ats_admin_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # Form protection. Allows normal users, slows automated spam.
    location = /request {
        limit_req zone=ats_request_form burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    location / {
        limit_req zone=ats_global burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}
