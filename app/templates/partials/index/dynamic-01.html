<style>
        :root {
            --gold: #c9a33a;
            --gold-soft: rgba(201, 163, 58, 0.55);
            --gold-glow: rgba(201, 163, 58, 0.95);
            --dark: #050505;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                linear-gradient(rgba(0,0,0,0.76), rgba(0,0,0,0.92)),
                {% if settings.home_background_url %}
                    url('{{ settings.home_background_url }}')
                {% else %}
                    radial-gradient(circle at center, #141414 0%, #050505 70%)
                {% endif %};
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: #e8dcc4;
            {% if settings.custom_cursor_url %}
            cursor: url('{{ settings.custom_cursor_url }}') 16 16, auto;
            {% endif %}
        }

        a,
        button,
        .main-card,
        .subcard {
            {% if settings.custom_cursor_url %}
            cursor: url('{{ settings.custom_cursor_url }}') 16 16, pointer;
            {% else %}
            cursor: pointer;
            {% endif %}
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            min-height: 100vh;
            background:
                radial-gradient(circle at center top, rgba(90, 55, 130, 0.18), transparent 38%),
                radial-gradient(circle at left 45%, rgba(160, 25, 25, 0.12), transparent 28%),
                radial-gradient(circle at right 45%, rgba(25, 120, 120, 0.10), transparent 30%);
        }

        header {
            max-width: 1280px;
            margin: 0 auto;
            padding: 42px 36px 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-weight: 900;
            font-size: 38px;
            line-height: 0.9;
            color: var(--gold);
            letter-spacing: -2px;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(201, 163, 58, 0.45);
        }

        nav {
            display: flex;
            gap: 46px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.8px;
            font-size: 17px;
        }

        nav a:hover {
            text-shadow: 0 0 12px var(--gold-glow);
        }

        .hero {
            max-width: 1180px;
            margin: 0 auto;
            padding: 48px 36px 36px;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--gold);
            font-size: 42px;
            line-height: 1.2;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 0 22px rgba(201, 163, 58, 0.35);
        }

        .ornament {
            width: 170px;
            height: 1px;
            margin: 24px auto;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            position: relative;
        }

        .ornament::after {
            content: "◇";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -52%);
            color: var(--gold);
            background: rgba(0,0,0,0.85);
            padding: 0 8px;
            font-size: 15px;
        }

        .subtitle {
            color: #b9ad98;
            font-size: 19px;
            line-height: 1.55;
            margin-bottom: 14px;
        }

        .cities {
            color: #9f947f;
            font-size: 18px;
        }

        .main-grid {
            max-width: 1220px;
            margin: 0 auto;
            padding: 26px 36px 52px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 34px;
        }

        .main-card {
            min-height: 690px;
            border: 1px solid rgba(201, 163, 58, 0.62);
            background:
                linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.82));
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: stretch;
            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        .main-card:hover {
            border-color: var(--gold);
            box-shadow:
                0 0 0 1px rgba(201, 163, 58, 0.45),
                0 0 28px rgba(201, 163, 58, 0.55),
                inset 0 0 34px rgba(201, 163, 58, 0.12);
            transform: translateY(-4px);
        }

        .main-card::before,
        .main-card::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 34px;
            border-color: var(--gold);
            opacity: 0.85;
            z-index: 4;
        }

        .main-card::before {
            top: 10px;
            left: 10px;
            border-top: 1px solid var(--gold);
            border-left: 1px solid var(--gold);
        }

        .main-card::after {
            right: 10px;
            bottom: 10px;
            border-right: 1px solid var(--gold);
            border-bottom: 1px solid var(--gold);
        }

        .main-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.74;
            filter: saturate(0.85) contrast(1.05);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .main-card:hover .main-bg {
            opacity: 0.92;
            transform: scale(1.035);
        }

        .main-overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to bottom, rgba(0,0,0,0.30), rgba(0,0,0,0.30) 42%, rgba(0,0,0,0.92) 78%),
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.48) 75%);
            z-index: 1;
        }

        .main-body {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 46px 34px 34px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: center;
        }

        .main-title {
            color: var(--gold);
            font-size: 32px;
            line-height: 1.28;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            text-shadow: 0 0 16px rgba(201, 163, 58, 0.35);
            margin-bottom: 34px;
        }

        .subgrid {
            display: grid;
            gap: 18px;
        }

        .subcard {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: 18px;
            line-height: 1.25;
            transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.2s ease;
        }

        .subcard:hover {
            color: #f2d984;
            text-shadow: 0 0 14px var(--gold-glow);
            transform: translateX(4px);
        }

        .work-cities {
            max-width: 1000px;
            margin: 0 auto;
            padding: 6px 36px 48px;
            text-align: center;
        }

        .section-title {
            color: var(--gold);
            font-size: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 22px;
        }

        .city-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            font-size: 17px;
        }

        .cta-footer {
            max-width: 1220px;
            margin: 0 auto;
            border-top: 1px solid rgba(201, 163, 58, 0.5);
            border-bottom: 1px solid rgba(201, 163, 58, 0.5);
            display: grid;
            grid-template-columns: 1fr 220px 1fr;
            min-height: 130px;
        }

        .cta-box {
            padding: 28px 36px;
            border-left: 1px solid rgba(201, 163, 58, 0.35);
            border-right: 1px solid rgba(201, 163, 58, 0.35);
        }

        .cta-title {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .cta-text {
            color: #8f8676;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .cta-button {
            display: inline-block;
            min-width: 240px;
            text-align: center;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 13px 24px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        .cta-button:hover {
            box-shadow: 0 0 18px rgba(201, 163, 58, 0.6);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .center-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 34px;
        }

        .socials {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .social {
            width: 48px;
            height: 48px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-family: Arial, sans-serif;
            font-weight: 800;
        }

        .copyright {
            text-align: center;
            color: #615947;
            font-size: 13px;
            padding: 18px;
        }

        @media (max-width: 980px) {
            header {
                grid-template-columns: 1fr;
                text-align: center;
            }

            nav {
                justify-content: center;
                flex-wrap: wrap;
                gap: 22px;
            }

            .main-grid {
                grid-template-columns: 1fr;
            }

            .main-card {
                min-height: 560px;
            }

            .cta-footer {
                grid-template-columns: 1fr;
            }

            .city-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        @media (max-width: 620px) {
            header {
                padding: 28px 20px 10px;
            }

            .logo {
                font-size: 30px;
            }

            .hero {
                padding: 36px 20px 26px;
            }

            h1 {
                font-size: 30px;
                letter-spacing: 3px;
            }

            .main-grid {
                padding: 20px;
                gap: 24px;
            }

            .main-card {
                min-height: 520px;
            }

            .main-title {
                font-size: 26px;
            }

            .subcard {
                font-size: 16px;
            }

            .cta-box {
                padding: 24px 20px;
            }
        }

        /* === ArtToSlipAway hover glow effects === */
        a,
        button,
        .button,
        .cta-button,
        .social,
        .main-card,
        .subcard,
        .card,
        .category-link,
        .filter,
        .city-grid div,
        .main-title,
        .sub-title,
        .card-title,
        .section-title,
        h1 {
            transition:
                color 0.22s ease,
                text-shadow 0.22s ease,
                border-color 0.22s ease,
                box-shadow 0.22s ease,
                transform 0.22s ease,
                filter 0.22s ease;
        }

        a:hover,
        nav a:hover,
        .logo:hover,
        .main-title:hover,
        .sub-title:hover,
        .card-title:hover,
        .section-title:hover,
        .city-grid div:hover {
            color: #f2d984 !important;
            text-shadow:
                0 0 8px rgba(242, 217, 132, 0.85),
                0 0 18px rgba(201, 163, 58, 0.55),
                0 0 32px rgba(201, 163, 58, 0.25);
        }

        .button:hover,
        .cta-button:hover,
        button:hover,
        .social:hover,
        .category-link:hover,
        .filter:hover {
            color: #111 !important;
            background: #f2d984 !important;
            border-color: #f2d984 !important;
            box-shadow:
                0 0 12px rgba(242, 217, 132, 0.75),
                0 0 28px rgba(201, 163, 58, 0.45);
            transform: translateY(-2px);
        }

        .main-card:hover,
        .card:hover,
        .subcard:hover {
            border-color: #f2d984 !important;
            box-shadow:
                0 0 0 1px rgba(201, 163, 58, 0.55),
                0 0 24px rgba(201, 163, 58, 0.45),
                inset 0 0 26px rgba(201, 163, 58, 0.10);
            transform: translateY(-3px);
        }

        .main-card:hover img,
        .card:hover img,
        .subcard:hover img,
        .main-card:hover .main-bg {
            filter:
                brightness(1.08)
                contrast(1.08)
                saturate(1.08);
        }

        .main-card:hover .main-title,
        .card:hover .card-title,
        .subcard:hover .sub-title {
            color: #f2d984 !important;
            text-shadow:
                0 0 10px rgba(242, 217, 132, 0.9),
                0 0 22px rgba(201, 163, 58, 0.55);
        }
        /* === /ArtToSlipAway hover glow effects === */


        /* === ArtToSlipAway logo image === */
        .logo.logo-image {
            display: inline-flex !important;
            align-items: center !important;
            text-decoration: none !important;
            line-height: 1 !important;
            font-size: 0 !important;
            letter-spacing: 0 !important;
            color: transparent !important;
        }

        .logo.logo-image img {
            display: block;
            height: 150px;
            width: auto;
            max-width: 420px;
            object-fit: contain;
            filter:
                drop-shadow(0 0 10px rgba(201, 163, 58, 0.42))
                drop-shadow(0 0 24px rgba(201, 163, 58, 0.25));
            transition:
                filter 0.25s ease,
                transform 0.25s ease;
        }

        .logo.logo-image:hover img {
            transform: translateY(-1px);
            filter:
                drop-shadow(0 0 10px rgba(242, 217, 132, 0.70))
                drop-shadow(0 0 26px rgba(201, 163, 58, 0.40));
        }

        @media (max-width: 768px) {
            .logo.logo-image img {
                height: 88px;
                max-width: 260px;
            }
        }
        /* === /ArtToSlipAway logo image === */


        /* === ArtToSlipAway home premium carousel polish === */
        html {
            scroll-behavior: smooth;
        }

        body {
            overflow-x: hidden !important;
            background-attachment: fixed !important;
            background-position: center center !important;
            background-size: cover !important;
            position: relative;
        }

        /* Дополнительное высветление статичного фона без движения */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: inherit;
            background-attachment: fixed;
            background-position: center center;
            background-size: cover;
            opacity: 0.22;
            filter: brightness(1.35) contrast(1.08) saturate(1.12);
            mix-blend-mode: screen;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at center 40%, rgba(201, 163, 58, 0.07), transparent 34%),
                radial-gradient(circle at left center, rgba(120, 28, 20, 0.12), transparent 32%),
                radial-gradient(circle at right center, rgba(20, 90, 70, 0.10), transparent 32%);
        }

        header,
        main,
        footer,
        section {
            position: relative;
            z-index: 1;
        }

        /* Логотип крупнее + премиальная анимация */
        .logo.logo-image {
            transform-origin: center center;
        }

        .logo.logo-image img {
            height: 190px !important;
            max-width: 540px !important;
            width: auto !important;
            object-fit: contain !important;
            filter:
                drop-shadow(0 0 12px rgba(242, 217, 132, 0.55))
                drop-shadow(0 0 32px rgba(201, 163, 58, 0.34)) !important;
            transition:
                transform 0.28s ease,
                filter 0.28s ease !important;
        }

        .logo.logo-image:hover img {
            transform: scale(1.13) translateY(-2px);
            filter:
                drop-shadow(0 0 16px rgba(242, 217, 132, 0.95))
                drop-shadow(0 0 42px rgba(201, 163, 58, 0.55)) !important;
        }

        .logo.logo-image:active img {
            animation: arttoslipawayLogoSpin 0.62s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes arttoslipawayLogoSpin {
            0% {
                transform: scale(1.13) rotate(0deg);
            }

            55% {
                transform: scale(1.20) rotate(280deg);
            }

            100% {
                transform: scale(1.13) rotate(360deg);
            }
        }

        .home-card-carousel {
            display: flex !important;
            grid-template-columns: none !important;
            align-items: center !important;
            justify-content: flex-start !important;
            gap: 30px !important;

            width: 100vw !important;
            max-width: none !important;

            margin-left: calc(50% - 50vw) !important;
            margin-right: calc(50% - 50vw) !important;

            padding:
                38px
                calc(50vw - min(42vw, 232px))
                66px
                calc(50vw - min(42vw, 232px)) !important;

            overflow-x: auto !important;
            overflow-y: visible !important;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;

            cursor: grab;
            scrollbar-width: none;
            perspective: 1900px;
            position: relative;
        }

        .home-card-carousel::-webkit-scrollbar {
            display: none;
        }

        .home-card-carousel.dragging {
            cursor: grabbing;
            scroll-behavior: auto;
        }

        .home-card-carousel .main-card {
            flex: 0 0 min(84vw, 435px) !important;
            width: min(84vw, 435px) !important;
            max-width: 435px !important;

            scroll-snap-align: center;
            scroll-snap-stop: always;

            opacity: 0.34;
            filter: brightness(0.55) saturate(0.82) blur(0.1px);
            transform-origin: center center;
            transform-style: preserve-3d;
            z-index: 1;

            transition:
                opacity 0.48s ease,
                filter 0.48s ease,
                transform 0.48s cubic-bezier(.2,.75,.2,1),
                box-shadow 0.48s ease,
                border-color 0.48s ease,
                text-shadow 0.48s ease;
        }

        .home-card-carousel .main-card.is-left {
            opacity: 0.36;
            filter: brightness(0.56) saturate(0.82);
            transform: scale(0.64) translateX(104px) translateY(34px) rotateY(24deg);
        }

        .home-card-carousel .main-card.is-right {
            opacity: 0.36;
            filter: brightness(0.56) saturate(0.82);
            transform: scale(0.64) translateX(-104px) translateY(34px) rotateY(-24deg);
        }

        .home-card-carousel .main-card.is-near.is-left {
            opacity: 0.56;
            filter: brightness(0.72) saturate(0.94);
            transform: scale(0.78) translateX(54px) translateY(12px) rotateY(13deg);
        }

        .home-card-carousel .main-card.is-near.is-right {
            opacity: 0.56;
            filter: brightness(0.72) saturate(0.94);
            transform: scale(0.78) translateX(-54px) translateY(12px) rotateY(-13deg);
        }

        .home-card-carousel .main-card.is-active {
            opacity: 1;
            filter: brightness(1.12) saturate(1.12);
            transform: scale(1.045) translateY(-8px) rotateY(0deg) !important;
            z-index: 20;

            border-color: #f2d984 !important;
            box-shadow:
                0 0 0 1px rgba(242, 217, 132, 0.90),
                0 0 34px rgba(242, 217, 132, 0.34),
                0 0 72px rgba(201, 163, 58, 0.38),
                0 0 132px rgba(201, 163, 58, 0.18),
                inset 0 0 34px rgba(201, 163, 58, 0.12) !important;
        }

        .home-card-carousel .main-card.is-active::after {
            content: "";
            position: absolute;
            inset: -1px;
            pointer-events: none;
            background:
                linear-gradient(120deg, transparent 0%, rgba(242, 217, 132, 0.08) 44%, rgba(242, 217, 132, 0.22) 50%, rgba(242, 217, 132, 0.08) 56%, transparent 100%);
            transform: translateX(-130%);
            animation: cardGoldSweep 4.8s ease-in-out infinite;
        }

        @keyframes cardGoldSweep {
            0%, 58% {
                transform: translateX(-130%);
                opacity: 0;
            }

            68% {
                opacity: 1;
            }

            86% {
                transform: translateX(130%);
                opacity: 0.75;
            }

            100% {
                transform: translateX(130%);
                opacity: 0;
            }
        }

        .home-card-carousel .main-card.is-active .main-title,
        .home-card-carousel .main-card.is-active h2,
        .home-card-carousel .main-card.is-active h3 {
            color: #f2d984 !important;
            text-shadow:
                0 0 10px rgba(242, 217, 132, 0.95),
                0 0 24px rgba(201, 163, 58, 0.72),
                0 0 44px rgba(201, 163, 58, 0.34) !important;
        }

        .home-card-carousel .main-card:not(.is-active) {
            cursor: pointer;
        }

        .home-card-carousel .main-card:not(.is-active) a,
        .home-card-carousel .main-card:not(.is-active) button,
        .home-card-carousel .main-card:not(.is-active) .btn,
        .home-card-carousel .main-card:not(.is-active) .button {
            pointer-events: none !important;
        }

        .home-card-carousel .main-card.is-active a,
        .home-card-carousel .main-card.is-active button,
        .home-card-carousel .main-card.is-active .btn,
        .home-card-carousel .main-card.is-active .button {
            pointer-events: auto !important;
        }

        .home-card-carousel .main-card a:hover,
        .home-card-carousel .main-card button:hover,
        .home-card-carousel .main-card span:hover,
        .home-card-carousel .main-card li:hover {
            color: #f2d984 !important;
            text-shadow:
                0 0 8px rgba(242, 217, 132, 0.82),
                0 0 18px rgba(201, 163, 58, 0.56);
        }

        .home-carousel-arrows {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: -30px auto 48px;
            position: relative;
            z-index: 40;
        }

        .home-carousel-arrow {
            width: 60px;
            height: 60px;
            border-radius: 999px;
            border: 1px solid rgba(242, 217, 132, 0.82);
            background: rgba(0, 0, 0, 0.68);
            color: #f2d984;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
            box-shadow:
                0 0 20px rgba(201, 163, 58, 0.34),
                inset 0 0 14px rgba(201, 163, 58, 0.14);
            transition:
                transform 0.22s ease,
                background 0.22s ease,
                color 0.22s ease,
                box-shadow 0.22s ease;
        }

        .home-carousel-arrow:hover {
            transform: translateY(-3px) scale(1.08);
            background: #f2d984;
            color: #111;
            box-shadow:
                0 0 28px rgba(242, 217, 132, 0.70),
                0 0 58px rgba(201, 163, 58, 0.38);
        }

        @media (max-width: 900px) {
            .logo.logo-image img {
                height: 110px !important;
                max-width: 320px !important;
            }

            .home-card-carousel {
                gap: 18px !important;
                padding:
                    24px
                    calc(50vw - min(42vw, 180px))
                    50px
                    calc(50vw - min(42vw, 180px)) !important;
