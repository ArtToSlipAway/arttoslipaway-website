<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ title }} — ArtToSlipAway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="https://arttoslipaway.art{{ request.url.path }}">
    <meta name="description" content="{{ description }}">
    <meta property="og:site_name" content="ArtToSlipAway">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ title }} — ArtToSlipAway">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="https://arttoslipaway.art{{ request.url.path }}">
    <meta property="og:image" content="https://arttoslipaway.art/static/og/og-home.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        :root {
            --bg: #070707;
            --panel: rgba(0,0,0,0.72);
            --gold: #c9a33a;
            --gold-light: #f2d984;
            --text: #e8ddc6;
            --muted: #9f947c;
            --border: rgba(201, 163, 58, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at center top, rgba(201, 163, 58, 0.10), transparent 36%),
                linear-gradient(180deg, #090909, #020202);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 22px 12px;
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .brand {
            color: var(--gold);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        nav a,
        .back-link {
            color: var(--gold);
            text-decoration: none;
        }

        nav a:hover,
        .back-link:hover {
            color: var(--gold-light);
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 34px 22px 80px;
        }

        .legal-card {
            border: 1px solid var(--border);
            background:
                linear-gradient(180deg, rgba(0,0,0,0.52), rgba(0,0,0,0.88)),
                radial-gradient(circle at left top, rgba(201, 163, 58, 0.07), transparent 42%);
            padding: clamp(22px, 4vw, 42px);
        }

        h1 {
            margin: 0 0 18px;
            color: var(--gold);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(34px, 5vw, 64px);
            line-height: 0.98;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        h2 {
            margin: 34px 0 12px;
            color: var(--gold-light);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: 400;
        }

        p, li {
            color: var(--text);
            line-height: 1.65;
            font-size: 16px;
        }

        ul {
            padding-left: 20px;
        }

        .muted {
            color: var(--muted);
        }

        .warning {
            border: 1px solid rgba(201, 163, 58, 0.28);
            background: rgba(201, 163, 58, 0.07);
            padding: 14px;
            margin: 20px 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .placeholder {
            color: var(--gold-light);
        }

        footer {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 22px 38px;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
    <!-- ATS_GLOBAL_PUBLIC_HEADER_LOGO_V1 -->
    <link rel="stylesheet" href="/static/site_header_logo.css?v=20260815-logo-exact-1to1-v1">
</head>

<body>
    <header>
        <a
            class="brand ats-site-header-logo"
            href="/"
            aria-label="ArtToSlipAway — на главную"
        >
            <img
                src="/static/images/logo.webp?v=20260815-logo-webp"
                alt="ArtToSlipAway"
                loading="eager"
                fetchpriority="high"
                decoding="async"
            >
        </a>

        <nav>
            <a href="/privacy">Политика</a>
            <a href="/consent">Согласие</a>
            <a href="/terms">Условия</a>
            <a href="/cookies">Cookies</a>
        </nav>
    </header>

    <main>


        <section class="legal-card">
            {{ content | safe }}
        </section>
    </main>

    <footer>
        ArtToSlipAway. Юридические документы сайта.
    </footer>
    <script defer src="/static/js/site-announcement.js?v=3"></script>
    <script src="/static/tattoo_cursor.js?v=20260722_201404" defer></script>
    <script defer src="/static/site_header_logo.js?v=20260815-logo-exact-1to1-v1"></script>
</body>
</html>
