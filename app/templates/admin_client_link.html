<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ссылка в кабинет клиента — ArtToSlipAway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

        <meta name="theme-color" content="#020202">
<style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #e8dcc4;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 36px 18px 70px;
        }

        .card {
            border: 1px solid rgba(201,163,58,0.42);
            background: rgba(0,0,0,0.72);
            padding: 24px;
        }

        h1 {
            color: #f2d984;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 400;
            margin: 0 0 18px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: #111;
            color: #f2d984;
            border: 1px solid rgba(201,163,58,0.42);
            padding: 12px;
            font-size: 15px;
        }

        a {
            color: #c9a33a;
        }

        .nav {
            margin-top: 20px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
    </style>

    <link rel="stylesheet" href="/static/admin.css?v=9">
</head>
<body class="admin-page">
<main>
    <div class="card">
        <h1>Ссылка в кабинет заявки #{{ lead.id }}</h1>

        <p>Скопируй ссылку и отправь клиенту вручную:</p>

        <textarea readonly>{{ client_url }}</textarea>

        <p>
            Ссылка активна до:
            <strong>{{ expires_at }}</strong>
        </p>

        <div class="nav">
            <a href="/admin/leads">Вернуться к заявкам</a>
            <a href="{{ client_url }}" target="_blank">Открыть кабинет</a>
        </div>
    </div>
</main>

    <script defer src="/static/js/admin-static-nav.js?v=3"></script>
{% include "partials/demo_banner.html" %}
</body>
</html>
